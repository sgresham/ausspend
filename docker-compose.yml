# Development stack for ausspend.
#
# The application database is the host `q` Mongo (mongodb://10.10.10.30:27017/ausspend_dev),
# never a container and never the pool Mongo. The one-shot `seed` service installs dependencies,
# builds the shared package and runs the guarded, non-destructive seed (real-only by default:
# the taxonomy and real source register are written, and no synthetic rows are created); the API
# and client only start after it succeeds. Live ingestion survives a restart. `SEED_MODE=synthetic`
# is the explicit legacy opt-in (retiring existing seed rows is a separate, backed-up
# `npm run clean:synthetic`). The opt-in `ingest` profile (never started by a plain `up`) re-runs
# federal ingestion. node_modules and build output live in named volumes so the bind-mounted
# source tree stays clean.
services:
  seed:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run seed"
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://10.10.10.30:27017/ausspend_dev}
      SEED_MODE: ${SEED_MODE:-real}
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - server_node_modules:/app/server/node_modules
      - shared_node_modules:/app/shared/node_modules
      - shared_dist:/app/shared/dist
    restart: 'no'

  ingest:
    profiles: ['ingest']
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run ingest:federal"
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://10.10.10.30:27017/ausspend_dev}
      AUSTENDER_START_DATE: ${AUSTENDER_START_DATE:-}
      AUSTENDER_END_DATE: ${AUSTENDER_END_DATE:-}
      INGEST_SOURCES: ${INGEST_SOURCES:-aus-tender}
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - server_node_modules:/app/server/node_modules
      - shared_node_modules:/app/shared/node_modules
      - shared_dist:/app/shared/dist
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: 'no'

  server:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm run dev -w server"
    ports:
      # Loopback only: nginx (host 443) is the sole public entry point. Never
      # publish 3001/5173 on 0.0.0.0.
      - '127.0.0.1:${SERVER_PORT:-3001}:3001'
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://10.10.10.30:27017/ausspend_dev}
      PORT: '3001'
      # Production same-origin origin; local dev may override CLIENT_ORIGIN.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-https://ausspend.com.au}
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - server_node_modules:/app/server/node_modules
      - shared_node_modules:/app/shared/node_modules
      - shared_dist:/app/shared/dist
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  client:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm run dev -w client -- --host 0.0.0.0"
    ports:
      # Vite dev server is loopback only; it must never be public.
      - '127.0.0.1:${CLIENT_PORT:-5173}:5173'
    environment:
      VITE_API_PROXY_TARGET: http://server:3001
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - server_node_modules:/app/server/node_modules
      - shared_node_modules:/app/shared/node_modules
      - shared_dist:/app/shared/dist
    depends_on:
      seed:
        condition: service_completed_successfully
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  app_node_modules:
  client_node_modules:
  server_node_modules:
  shared_node_modules:
  shared_dist:
