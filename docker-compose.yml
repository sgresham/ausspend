services:
  server:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run build -w shared && npm run dev:server"
    ports:
      - '3001:3001'
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://10.10.10.30:27017/ausspend_dev}
      PORT: '3001'
      CLIENT_ORIGIN: http://localhost:5173
    volumes:
      - .:/app

  client:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:client -- --host 0.0.0.0"
    ports:
      - '5173:5173'
    environment:
      VITE_API_PROXY_TARGET: http://server:3001
    volumes:
      - .:/app
    depends_on:
      - server
