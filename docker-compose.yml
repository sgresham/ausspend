# Development stack for ausspend.
#
# The application database is the host `q` Mongo (mongodb://10.10.10.30:27017/ausspend_dev),
# never a container and never the pool Mongo. The one-shot `seed` service installs dependencies,
# builds the shared package and runs the guarded seed; the API and client only start after it
# succeeds. node_modules and build output live in named volumes so the bind-mounted source tree
# stays clean.
services:
  seed:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run seed"
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://10.10.10.30:27017/ausspend_dev}
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - server_node_modules:/app/server/node_modules
      - shared_node_modules:/app/shared/node_modules
      - shared_dist:/app/shared/dist
    restart: 'no'

  server:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm run dev -w server"
    ports:
      - '3001:3001'
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://10.10.10.30:27017/ausspend_dev}
      PORT: '3001'
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - server_node_modules:/app/server/node_modules
      - shared_node_modules:/app/shared/node_modules
      - shared_dist:/app/shared/dist
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  client:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm run dev -w client -- --host 0.0.0.0"
    ports:
      - '5173:5173'
    environment:
      VITE_API_PROXY_TARGET: http://server:3001
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - server_node_modules:/app/server/node_modules
      - shared_node_modules:/app/shared/node_modules
      - shared_dist:/app/shared/dist
    depends_on:
      seed:
        condition: service_completed_successfully
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  app_node_modules:
  client_node_modules:
  server_node_modules:
  shared_node_modules:
  shared_dist:
